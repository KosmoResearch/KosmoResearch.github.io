<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Kosmo Research project pages">
  <title>Kosmo Research | Project Pages</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #172033; background: #f6f7fa; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(100% - 40px, 920px); margin: 0 auto; padding: clamp(64px, 12vw, 130px) 0; }
    p { color: #657086; line-height: 1.65; }
    h1 { margin: 0 0 12px; font-size: clamp(36px, 7vw, 64px); letter-spacing: -.045em; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; margin-top: 48px; }
    .card { display: block; padding: 32px; border: 1px solid #dfe3eb; border-radius: 16px; color: inherit; background: #fff; text-decoration: none; box-shadow: 0 18px 48px rgba(26,32,51,.07); transition: transform .18s ease, border-color .18s ease; }
    .card:hover { transform: translateY(-3px); border-color: #6456c7; }
    .card h2 { margin: 0 0 8px; font-size: 26px; }
    .card p { margin: 0; }
    .card span { display: inline-block; margin-top: 24px; color: #4b3eb2; font-weight: 750; }
    @media (max-width: 680px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>Kosmo Research</h1>
    <p>Research project pages and interactive demonstrations.</p>
    <div class="grid">
      <a class="card" href="./GeoWeaver/">
        <h2>GeoWeaver</h2>
        <p>Accurate long-sequence 3D reconstruction via hierarchical geometric assembly.</p>
        <span>View project →</span>
      </a>
      <a class="card" href="./UniQuery4R/">
        <h2>UniQuery4R</h2>
        <p>Unified 4D scene reconstruction from a single query.</p>
        <span>View project →</span>
      </a>
    </div>
  </main>
</body>
</html>
